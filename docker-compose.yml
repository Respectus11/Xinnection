services:
  db:
    image: postgres:16-alpine
    container_name: xinnection-db
    environment:
      POSTGRES_USER: xinnection
      POSTGRES_PASSWORD: xinnection
      POSTGRES_DB: xinnection
    ports:
      - "5432:5432"
    volumes:
      - xinnection-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xinnection -d xinnection"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: xinnection-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  xinnection-pgdata:
